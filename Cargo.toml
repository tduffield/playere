[package]
name = "playere"
version = "0.1.0"
edition = "2021"

[dependencies]
wry = "0.24"
regex = "1.10"
serde_json = "1.0"

# Toggling the traffic-light buttons' alpha needs AppKit directly; tao exposes
# only the raw NSWindow pointer.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.24"
